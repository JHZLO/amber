[package]
name = "amber-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Amber 의 Tauri 없는 Rust: AI CLI 실행, 리포트 수집, 외부 DB 접속, 키체인, CLI 감지, 셸 PATH"

[features]
# 지금 앱(src-tauri)이 켠다 — 함수에 #[tauri::command] 를 붙이고 스트리밍을 Tauri Channel 로 보낸다.
# GPUI 앱은 끈 채로 쓰고, 스트리밍은 crate::Channel(콜백)로 받는다
tauri = ["dep:tauri"]

[dependencies]
tauri = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros", "sync"] }
# AI CLI 자식 프로세스 취소, 종료 정리용 kill(2). tokio 의 kill_on_drop 은 트레이 "종료"(process::exit)에서
# Drop 이 안 돌아 발화하지 않는다.
libc = "0.2"
# 지운 노트, 개념은 영구 삭제 대신 macOS 휴지통으로(files.rs)
trash = "5"
# DB 스키마 연동(dbconn.rs) — MySQL information_schema 를 읽기 전용으로 introspect 한다.
# tauri-plugin-sql 이 이미 끌어온 sqlx 0.8 과 같은 계열이라 한 번만 컴파일된다. TLS 는 rustls.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql"] }
# 접속 비밀번호는 macOS 키체인에만(/usr/bin/security 로 읽고 쓴다 — dbconn.rs "키체인" 절) — amber.db·파일·로그
# 어디에도 쓰지 않는다. keyring 크레이트를 쓰지 않는 이유도 거기에 적혀 있다(빌드마다 뜨는 접근 확인창).
