[package]
name = "amber-gpui"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "=0.9.0"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
resvg = "0.45.1"
merman = { version = "=0.10.0-alpha.1", features = ["math"] }
