[package]
name = "amber-gpui"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "=0.9.0"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: 설정에 저장하는 JSON 이 JS 의 JSON.stringify 와 같은 키 순서여야 한다
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
resvg = "0.45.1"
merman = { version = "=0.10.0-alpha.1", features = ["math"] }
